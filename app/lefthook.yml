# The course repository holds more than the app, so the hooks run only when a
# commit touches app/. Committing with --no-verify is not allowed.
pre-commit:
  parallel: false
  commands:
    check:
      root: "app/"
      glob: "app/**"
      run: pnpm check
    test:
      root: "app/"
      glob: "app/**"
      run: pnpm test
